[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "playground"
version = "0.1.0"
description = "Isaac Lab tasks for RL, IL and teleoperation on the Isaac-Envs assets."
# Isaac Sim 6.2 / Isaac Lab 3.0 are 3.12 only.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Isaac Lab's root project (external/IsaacLab/pyproject.toml): every source package
    # and all their third-party pins (torch, Newton, warp, rsl-rl-lib, ...).
    "isaaclab-dev[isaacsim]",
    "isaaclab-mimic",
    "isaaclab-teleop",
    "feetech-servo-sdk",
    "notifier",
]

[dependency-groups]
dev = ["black==26.5.1", "pytest"]

[tool.uv]
# NVIDIA and PyTorch indexes carry some of the same names as PyPI.
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Copied from external/IsaacLab/pyproject.toml: overrides are not inherited from a dependency.
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
# cu130: torch 2.11 for Isaac Lab 3.0; the GPU here is Blackwell (sm_120).
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
omniverseclient = { index = "pypi-public" }
# Source installs: the wheels have no scripts/ to run.
isaaclab-dev = { path = "external/IsaacLab", editable = true }
isaaclab = { path = "external/IsaacLab/source/isaaclab", editable = true }
isaaclab-assets = { path = "external/IsaacLab/source/isaaclab_assets", editable = true }
isaaclab-contrib = { path = "external/IsaacLab/source/isaaclab_contrib", editable = true }
isaaclab-experimental = { path = "external/IsaacLab/source/isaaclab_experimental", editable = true }
isaaclab-mimic = { path = "external/IsaacLab/source/isaaclab_mimic", editable = true }
isaaclab-newton = { path = "external/IsaacLab/source/isaaclab_newton", editable = true }
isaaclab-ov = { path = "external/IsaacLab/source/isaaclab_ov", editable = true }
isaaclab-physx = { path = "external/IsaacLab/source/isaaclab_physx", editable = true }
isaaclab-ppisp = { path = "external/IsaacLab/source/isaaclab_ppisp", editable = true }
isaaclab-rl = { path = "external/IsaacLab/source/isaaclab_rl", editable = true }
isaaclab-tasks = { path = "external/IsaacLab/source/isaaclab_tasks", editable = true }
isaaclab-tasks-experimental = { path = "external/IsaacLab/source/isaaclab_tasks_experimental", editable = true }
isaaclab-teleop = { path = "external/IsaacLab/source/isaaclab_teleop", editable = true }
isaaclab-visualizers = { path = "external/IsaacLab/source/isaaclab_visualizers", editable = true }
notifier = { git = "https://github.com/Chany-Lab/Notifier.git" }

[tool.uv.extra-build-variables]
egl-probe = { CMAKE_POLICY_VERSION_MINIMUM = "3.5" }

[tool.setuptools.packages.find]
include = ["playground*"]

[tool.black]
target-version = ["py312"]
